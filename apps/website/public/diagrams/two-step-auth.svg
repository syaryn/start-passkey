<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#525252"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0D32B2"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="560" fill="#FFFFFF"/>
  <text x="40" y="54" font-size="26" font-weight="bold" fill="#0A0F25">二段階認証・二要素認証のイメージ</text>

  <text x="40" y="106" font-size="18" fill="#676C7E">ふつうの二段階認証</text>
  <rect x="40" y="122" width="270" height="128" rx="10" fill="#FFFFFF" stroke="#525252" stroke-width="1.5"/>
  <text x="62" y="156" font-size="17" fill="#676C7E">1つ目：知っていること</text>
  <text x="62" y="192" font-size="21" font-weight="bold" fill="#0A0F25">パスワード</text>
  <text x="62" y="222" font-size="16" fill="#676C7E">覚えた文字列を打つ</text>

  <line x1="318" y1="186" x2="350" y2="186" stroke="#525252" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="360" y="122" width="320" height="128" rx="10" fill="#FFFFFF" stroke="#525252" stroke-width="1.5"/>
  <text x="382" y="156" font-size="17" fill="#676C7E">2つ目：本人だけができる確認</text>
  <text x="382" y="186" font-size="17" fill="#0A0F25">認証アプリ 6桁コード（TOTP）</text>
  <text x="382" y="214" font-size="17" fill="#0A0F25">SMS・メール 届くコード</text>
  <text x="382" y="242" font-size="17" fill="#0A0F25">パスキー 指紋・顔・画面ロック</text>

  <line x1="688" y1="186" x2="720" y2="186" stroke="#525252" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="730" y="122" width="190" height="128" rx="10" fill="#EDF0FD" stroke="#0D32B2" stroke-width="1.5"/>
  <text x="825" y="176" font-size="15" fill="#676C7E" text-anchor="middle">両方そろうと</text>
  <text x="825" y="208" font-size="22" font-weight="bold" fill="#0A0F25" text-anchor="middle">ログイン</text>

  <text x="40" y="332" font-size="18" fill="#676C7E">パスワードレスのパスキー</text>
  <rect x="40" y="348" width="640" height="104" rx="10" fill="#EDF0FD" stroke="#0D32B2" stroke-width="1.5"/>
  <text x="62" y="392" font-size="20" font-weight="bold" fill="#0A0F25">パスキー（指紋・顔・画面ロック）</text>
  <text x="62" y="424" font-size="16" fill="#0A0F25">パスワードを打たず、端末で承認だけ</text>

  <path d="M 688 400 H 825 V 260" fill="none" stroke="#0D32B2" stroke-width="2" marker-end="url(#arrowBlue)"/>

  <text x="40" y="492" font-size="17" font-weight="bold" fill="#0D32B2">1つ目（パスワード）はスキップして、ログインへ進みます</text>
  <text x="40" y="524" font-size="16" fill="#676C7E">パスワードを打たないので、偽サイトにパスワードを渡しにくい</text>
</svg>
